<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="moodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#moodGrad)" stroke-width="8" opacity="0.3" filter="url(#glow)"/>

  <!-- Music Sound Waves & Heart/Emotion Waveform -->
  <g transform="translate(136, 156)">
    <!-- Equalizer bars / Mood waves -->
    <rect x="24" y="80" width="16" height="80" rx="8" fill="url(#moodGrad)"/>
    <rect x="56" y="40" width="16" height="160" rx="8" fill="url(#moodGrad)"/>
    <rect x="88" y="10" width="16" height="220" rx="8" fill="url(#moodGrad)"/>
    <rect x="120" y="60" width="16" height="140" rx="8" fill="url(#moodGrad)"/>
    <rect x="152" y="20" width="16" height="200" rx="8" fill="url(#moodGrad)"/>
    <rect x="184" y="70" width="16" height="120" rx="8" fill="url(#moodGrad)"/>
    <rect x="216" y="100" width="16" height="60" rx="8" fill="url(#moodGrad)"/>
  </g>
</svg>