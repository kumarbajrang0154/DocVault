<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#docGrad)" stroke-width="6" opacity="0.35" filter="url(#glow)"/>

  <!-- Shield Vault & Document Icon -->
  <g transform="translate(136, 126)">
    <!-- Shield Outline -->
    <path d="M120 10 L216 50 V130 C216 195 174 252 120 270 C66 252 24 195 24 130 V50 L120 10 Z" fill="none" stroke="url(#docGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Keyhole / Lock Badge inside Shield -->
    <rect x="88" y="100" width="64" height="72" rx="12" fill="url(#docGrad)"/>
    <circle cx="120" cy="92" r="24" fill="none" stroke="url(#docGrad)" stroke-width="12"/>
    <circle cx="120" cy="128" r="8" fill="#09090b"/>
    <path d="M120 134 V152" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
